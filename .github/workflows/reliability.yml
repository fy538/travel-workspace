name: Reliability

on:
  schedule:
    - cron: '10 7 * * *'
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types:
      - travel-agent-ci-success
      - travel-app-ci-success

concurrency:
  group: reliability-${{ github.ref }}-${{ github.event.client_payload.source_repo }}-${{ github.event.client_payload.source_sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workspace-checks:
    name: Reliability checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://vesper:localdev@localhost:5432/vesper # pragma: allowlist secret
      TEST_DATABASE_URL: postgresql://vesper:localdev@localhost:5432/vesper # pragma: allowlist secret
      TEST_DATABASE_DISPOSABLE: '1'
    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_DB: vesper
          POSTGRES_USER: vesper
          POSTGRES_PASSWORD: localdev # pragma: allowlist secret
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vesper" --health-interval 5s
          --health-timeout 5s --health-retries 10
      qdrant:
        image: qdrant/qdrant:v1.17.1
        ports: ['6333:6333']
    steps:
      - name: Check out workspace
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve and record immutable candidate tuple
        id: child_refs
        run: python3 scripts/resolve_ci_tuple.py

      - name: Require private checkout credentials
        env:
          CHECKOUT_TOKEN: ${{ secrets.TRAVEL_WORKSPACE_CI_TOKEN }}
        run: |
          test -n "$CHECKOUT_TOKEN" || { echo "::error::TRAVEL_WORKSPACE_CI_TOKEN must have read access to both private child repositories"; exit 1; }

      # Child documentation governance reads baseline commit trees from history.
      - name: Check out Travel Agent
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/travel-agent
          path: travel-agent
          ref: ${{ steps.child_refs.outputs.agent_ref }}
          token: ${{ secrets.TRAVEL_WORKSPACE_CI_TOKEN }}
          fetch-depth: 0

      - name: Check out Travel App
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/travel-app
          path: travel-app
          ref: ${{ steps.child_refs.outputs.app_ref }}
          token: ${{ secrets.TRAVEL_WORKSPACE_CI_TOKEN }}
          fetch-depth: 0

      - name: Assert actual checkouts equal candidate tuple
        run: python3 scripts/resolve_ci_tuple.py --assert-checkouts

      - name: Upload candidate identity
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: candidate-tuple
          path: candidate-tuple.json
          if-no-files-found: error

      - name: Require Qdrant readiness
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:6333/readyz > /dev/null; then
              echo "Qdrant is ready for journey checks"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Qdrant did not become ready before dependency installation"
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: travel-agent/requirements-dev.txt

      - name: Install backend dependencies
        run: pip install -r requirements-dev.txt
        working-directory: travel-agent

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: travel-app/package-lock.json

      - name: Workspace reliability tooling regression tests
        run: python -m pytest scripts/tests/ -q

      - name: Maestro flow inventory validation
        run: make maestro-flow-inventory-check

      - name: OpenAPI snapshot freshness
        # Regenerate the snapshot offline from the backend models and fail
        # if it differs from the committed docs/openapi.json. Catches the
        # drift that silently broke frontend types on 2026-05-19: backend
        # models changed (expense category enum, new schemas) but the
        # committed snapshot was never regenerated. Pairs with the
        # contract check below (schema.gen.ts vs snapshot) for full
        # backend → snapshot → types coverage.
        run: |
          PYTHONPATH=. python scripts/export_openapi.py --out /tmp/openapi.fresh.json
          if ! diff -q "$GITHUB_WORKSPACE/docs/openapi.json" /tmp/openapi.fresh.json > /dev/null; then
            echo "::error::docs/openapi.json is stale vs the backend models."
            echo "Run ./scripts/sync-types.sh and commit docs/openapi.json + schema.gen.ts together."
            diff "$GITHUB_WORKSPACE/docs/openapi.json" /tmp/openapi.fresh.json | head -60 || true
            exit 1
          fi
          echo "✓ OpenAPI snapshot matches the backend models"
        working-directory: travel-agent

      - name: New-document governance guard
        # Phase 1 is intentionally non-retroactive: only Markdown files added
        # by this workspace change need lifecycle metadata. Existing docs and
        # edits to existing docs remain grandfathered until classification.
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          BASE_SHA="${PR_BASE_SHA:-$PUSH_BASE_SHA}"
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="HEAD^"
          fi
          python3 scripts/check_doc_governance.py --new-since "$BASE_SHA"

      - name: Documentation inventory coverage
        # Phase 2 gate: a new file may carry valid metadata but it must also
        # receive an explicit disposition in the living inventory.
        run: make docs-inventory-check

      - name: Canonical documentation spine and current-state drift
        # Phase 3: navigation is bounded to eight entry points and the
        # current-state summary is derived from committed registries.
        run: make docs-spine-check docs-status-check docs-links-check docs-child-governance-check

      - name: API coverage check
        # Verifies method-aware mobile calls, named non-mobile consumers,
        # lifecycle policy, and stale/dark operation classifications.
        run: make api-coverage-check

      - name: M0 authority and contract reachability report
        # Keep one machine-readable summary of the five M0 gates even though
        # the individual checks above remain the authoritative failures.
        run: make m0-reachability-report | tee m0-reachability-report.txt

      - name: Journey-set registry guard
        # Pure file-parse (no DB): journeys.yaml ↔ docs ↔ README ↔ persona-cert
        # must agree on the journey SET, so a journey added to one definition
        # registry but forgotten in another fails CI. Reports (non-fatally) the
        # contract/logic fidelity gap for the holistic-extension journeys.
        run: make journey-registry-check

      - name: Flag registry guard
        # Pure file-parse (no DB): fails if any `active` flag in
        # docs/flags/registry.yaml is past its review/removal date. This is
        # the enforcement floor for flag hygiene — the local pre-commit hook
        # (workspace .pre-commit-config.yaml, pre-push stage) catches this
        # first, but a skipped hook or an un-configured clone must not let a
        # stale dark flag go unnoticed indefinitely.
        run: make flag-registry-check

      - name: Compatibility and card-arrival contract guards
        run: make compatibility-check card-arrival-check chat-card-types-check

      - name: Install frontend dependencies
        run: npm ci
        working-directory: travel-app

      - name: Contract check
        run: make contract-check

      - name: Journey mock-walk (tier 1)
        run: npm test -- __tests__/journeys/ --runInBand
        working-directory: travel-app

      - name: Maestro flow metadata validation
        run: make maestro-flow-metadata-check

      - name: M-1 surface contraction guard
        # Product dispositions are checked against the executable surface,
        # canonical-entry, route-owner, and generated-route registries.
        run: npm run --silent surface:contraction:check
        working-directory: travel-app

      - name: Journey-list drift guard
        # Pure file-glob (no DB): fails if scenarios.mjs and tests/scenarios/
        # test_j*.py have drifted, so a new BE journey can't silently fall out
        # of the qa:logic runner. Both child repos are checked out as siblings,
        # so the runner resolves ../travel-agent.
        run: npm run qa:logic:check-drift
        working-directory: travel-app

      - name: Prepare disposable journey database
        run: PYTHONPATH=. alembic upgrade head
        working-directory: travel-agent

      - name: Golden path QA
        # These scenarios exercise real persistence, not the offline partition.
        run: make golden-path-qa

      - name: Reliability gate
        run: make reliability-gate

      - name: Write reliability report
        if: always()
        run: make reliability-report > reliability-report.txt

      - name: Upload reliability report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reliability-report-${{ github.run_id }}
          path: |
            reliability-report.txt
            m0-reachability-report.txt
          retention-days: 14

  maestro-flow-validation:
    name: Maestro syntax shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Check out workspace
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Resolve and record immutable candidate tuple
        id: child_refs
        run: python3 scripts/resolve_ci_tuple.py

      - name: Require private checkout credentials
        env:
          CHECKOUT_TOKEN: ${{ secrets.TRAVEL_WORKSPACE_CI_TOKEN }}
        run: |
          test -n "$CHECKOUT_TOKEN" || { echo "::error::TRAVEL_WORKSPACE_CI_TOKEN must have read access to both private child repositories"; exit 1; }

      # Syntax shards use exact pinned child trees and do not inspect their history.
      - name: Check out Travel Agent
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/travel-agent
          path: travel-agent
          ref: ${{ steps.child_refs.outputs.agent_ref }}
          token: ${{ secrets.TRAVEL_WORKSPACE_CI_TOKEN }}
          fetch-depth: 1

      - name: Check out Travel App
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/travel-app
          path: travel-app
          ref: ${{ steps.child_refs.outputs.app_ref }}
          token: ${{ secrets.TRAVEL_WORKSPACE_CI_TOKEN }}
          fetch-depth: 1

      - name: Assert actual checkouts equal candidate tuple
        run: python3 scripts/resolve_ci_tuple.py --assert-checkouts

      - name: Upload candidate identity
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: candidate-tuple-maestro-${{ matrix.shard }}
          path: candidate-tuple.json
          if-no-files-found: error
          retention-days: 14

      - name: Set up Java for Maestro
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install pinned Maestro CLI
        env:
          MAESTRO_VERSION: 2.6.1
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Validate this required syntax partition
        working-directory: travel-app
        run: |
          set -euo pipefail
          python3 ../scripts/partition_maestro_flows.py \
            --app-dir . --shard '${{ matrix.shard }}' \
            --shards '${{ strategy.job-total }}' --nul-delimited \
            | xargs -0 -n 1 maestro check-syntax

  contract-and-golden-path:
    name: Contract and golden paths
    if: always()
    needs: [workspace-checks, maestro-flow-validation]
    runs-on: ubuntu-latest
    steps:
      - name: Check out workspace
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Require workspace checks and every Maestro syntax shard
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/require_successful_jobs.py workspace-checks maestro-flow-validation
